version: customer-confirmation-v1
prompt: |
  客户收货确认的共用判定规则（图片、录音和录屏均适用）：
  1. “出现收货关键词”本身绝不等于客户确认。必须先确认这句话是谁说的，再判断语义；只能将收件客户本人明确表示收到/拿到包裹作为确认。音视频中，receipt_quote 必须逐字存在于 receipt_speaker_id 对应的 ASR 说话人片段中，且该 speaker_id 的角色必须有对话上下文支持为 customer。若“ได้รับแล้ว”等词只出现在客服/快递员的话里，或客户只回答礼貌用语，不能判 confirmed。
  2. 常见明确收货语义包括“这个包裹我已经收到了”；泰语“ได้รับแล้ว”表示“已经收到”，客服询问是否收到包裹后，客户回答“ได้ ได้รับแล้วครับผม”或“ได้รับแล้วค่ะ”，属于明确确认。口语重复、语气词不改变明确语义，但这些词必须确实由客户说出。
  3. “好的”“谢谢”“ครับผม”“ค่ะ”等礼貌回应单独出现，不代表收到包裹；“放门口吧”“稍后去拿”表示安排或意向，不代表已收到。快递员/客服自述已送达、系统状态、已读、表情、反问、否认、假设或转述他人说法，均不能当作客户本人确认。
  4. 结合上下文辨别肯定、否认、疑问及时间；“还没收到”“你说我收到了？”不能判为确认。当地语言文字或语音清晰时，不得因不是中文而判模糊；语义不能可靠确认时才标 unclear/uncertain。
  5. 客户确认必须关联本单：核对证据中可读的 pno/订单信息与目标 pno。手机号参数存在时，客户/聊天对象手机号还必须与其一致；手机号缺失、部分可见或无法与对话对象关联时，不得声称手机号匹配。若调用接口没有手机号参数，只能注明无法按手机号核验，不能伪造参数或号码。
  6. 仅采信证据中可核验的客户原话/消息，不得补全听不清、缺失或被截断的内容。报告原文、说话人/发言方和本单关联依据；客户身份或本单关联有实质歧义时返回 uncertain。
