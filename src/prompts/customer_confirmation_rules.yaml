version: customer-confirmation-v2
prompt: |
  客户收货确认的共用判定规则（图片、录音和录屏均适用）：
  1. “出现收货关键词”本身绝不等于客户确认。必须先确认这句话是谁说的，再判断语义；只能将收件客户本人明确表示收到/拿到包裹作为确认。音视频中，receipt_quote 必须逐字存在于 receipt_speaker_id 对应的 ASR 说话人片段中，且该 speaker_id 的角色必须有对话上下文支持为 customer。若“ได้รับแล้ว”等词只出现在客服/快递员的话里，或客户只回答礼貌用语，不能判 confirmed。
  2. 常见明确收货语义包括“这个包裹我已经收到了”；泰语“ได้รับแล้ว”表示“已经收到”，客服询问是否收到包裹后，客户回答“ได้ ได้รับแล้วครับผม”或“ได้รับแล้วค่ะ”，属于明确确认。口语重复、语气词不改变明确语义，但这些词必须确实由客户说出。
  3. “好的”“谢谢”“ครับผม”“ค่ะ”等礼貌回应单独出现，不代表收到包裹（唯一例外：它是客户对“您是否已经收到这个包裹”这个提问的直接回复，见下条）；“放门口吧”“稍后去拿”表示安排或意向，不代表已收到。快递员/客服自述已送达、系统状态、已读、表情、反问、否认、假设或转述他人说法，均不能当作客户本人确认。
  3a. 例外：另一方（快递员/客服）紧挨在前明确问“您是否已经收到这个（本单）包裹”（如“อันนี้พี่ได้รับพัสดุเรียบร้อยแล้วนะคะ”“您收到了吧？”），客户马上回答“ค่ะ”“ครับ”“ใช่”“嗯”等表示“是的”的肯定词，且之后没有否认或改口，
     这个回答在语义上就是对“已收到”的肯定，可以采信。必须是对“是否已收到包裹”这类问题的回复：对其他问题（“方便吗”“听得到吗”）或没有提问时的应声不算；
     客户先用肯定词回答，接着在同一句或下一句里追问或补充细节（如“ค่ะ เขาถ่ายหน้าบ้านเลยใช่ไหม”“嗯，是在家门口拍的吗？”），只要没有否认或改口，那个肯定词仍然是对前面提问的回答，追问不会让它失效；
     只有客户没有先回答、直接转去问别的事，或回答之后又否认，才不能算。
  3b. “好的”“OK”“明白”“谢谢”（如“โอเค”“เข้าใจ”“รับทราบ”“ขอบคุณ”“OK OK”）表示听懂了、同意安排或客气，不是“是的，我收到了”，即使回在“收到了吗”之后也不算确认；
     客户只是重复快递员的话（如复述包裹类型“TikTok”）再加一句 OK，同样只是听懂，不是确认。
  3c. 结合整段通话判断包裹是否真的交到了客户手里：快递员说包裹放在门卫/保安亭/物业/前台，或客户还在说要付款、让快递员到了再通知等，
     说明客户可能还没有拿到包裹，这时客户只是应声不能确认收货，必须有客户本人明确说出“已经收到/拿到了”。
  4. 结合上下文辨别肯定、否认、疑问及时间；“还没收到”“你说我收到了？”不能判为确认。当地语言文字或语音清晰时，不得因不是中文而判模糊；语义不能可靠确认时才标 unclear/uncertain。
  5. 客户确认必须关联本单：核对证据中可读的 pno/订单信息与目标 pno。手机号参数存在时，客户/聊天对象手机号还必须与其一致；手机号缺失、部分可见或无法与对话对象关联时，不得声称手机号匹配。若调用接口没有手机号参数，只能注明无法按手机号核验，不能伪造参数或号码。
  6. 仅采信证据中可核验的客户原话/消息，不得补全听不清、缺失或被截断的内容。报告原文、说话人/发言方和本单关联依据；客户身份或本单关联有实质歧义时返回 uncertain。
